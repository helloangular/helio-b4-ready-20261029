# B4 (qa227, 29 Oct 2026): TC-204 missing service mapping: deliberately left unmapped
# Rendered by agents/b4/lane.py from lanes/single-env.template.yml; edit the template, not this file.
# Helio dispatch contract: workflow_dispatch with `environment` and `helio_execution_id` inputs, run-name echo.
# Nothing is deployed and no secret is used.
name: b4-ready-unmapped
run-name: ${{ inputs.helio_execution_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: false
        default: b4-ready-test
        options: [b4-ready-test]
      helio_execution_id:
        type: string
        required: false
        default: ''
      helio_release_id:
        type: string
        required: false
        default: ''
      workflow_revision:
        type: string
        required: false
        default: ''
      release_version:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: b4-ready-test
    steps:
      - name: Synthetic work
        shell: bash
        env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          echo "b4-ready-unmapped run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
          echo "B4_VARS_BEGIN"; printf '%s\n' "$VARS_JSON"; echo "B4_VARS_END"
          sleep 20
          echo "synthetic step passed"
